services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tide
      POSTGRES_PASSWORD: tide
      POSTGRES_DB: tide_scheduler
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tide -d tide_scheduler"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://tide:tide@db:5432/tide_scheduler
    ports:
      - "${API_PORT:-8000}:8000"

volumes:
  postgres_data:
